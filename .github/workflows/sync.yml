name: Agmarknet Mandi Sync

on:
  schedule:
    # ── 5 Daily Checkpoints in IST (GitHub Actions runs in UTC) ──
    # Wave 1: 01:00 PM IST (07:30 UTC) - Morning auctions
    - cron: '30 7 * * *'
    # Wave 2: 03:45 PM IST (10:15 UTC) - Afternoon active auctions
    - cron: '15 10 * * *'
    # Wave 3: 06:30 PM IST (13:00 UTC) - Evening auction closing
    - cron: '0 13 * * *'
    # Wave 4: 08:30 PM IST (15:00 UTC) - Night returns consolidation
    - cron: '0 15 * * *'
    # Wave 5: 11:30 PM IST (18:00 UTC) - Final EOD Sync & Freeze
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD) [Default: Today in IST]'
        required: false
        default: ''
      end_date:
        description: 'End Date (YYYY-MM-DD) [Default: Same as Start Date]'
        required: false
        default: ''
      states:
        description: 'Specific states (e.g. "madhya pradesh,rajasthan" or "all") [Default: 10 Core Priority States]'
        required: false
        default: ''

concurrency:
  group: mandi-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Mandi Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node src/index.js "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.states }}"
