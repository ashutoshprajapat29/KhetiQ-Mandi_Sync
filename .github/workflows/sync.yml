name: Agmarknet Mandi Sync

on:
  schedule:
    # -- Daily Checkpoints in IST (Compensated for GitHub Actions ~5h queue latency) --
    # Early Morning Wave A: 06:48 AM IST (01:18 UTC) -> Actually executes ~12:00 PM - 12:30 PM IST (Midday arrivals)
    - cron: '18 1 * * *'
    # Early Morning Wave B: 07:48 AM IST (02:18 UTC) -> Actually executes ~01:00 PM - 01:30 PM IST (Lunchtime auctions)
    - cron: '18 2 * * *'
    # Wave 1: 10:53 AM IST (05:23 UTC) -> Actually executes ~04:15 PM - 04:45 PM IST (Afternoon active auctions)
    - cron: '23 5 * * *'
    # Wave 2: 12:45 PM IST (07:15 UTC) -> Actually executes ~06:40 PM - 07:40 PM IST (Evening closing rates)
    - cron: '15 7 * * *'
    # Wave 3: 03:40 PM IST (10:10 UTC) -> Actually executes ~09:20 PM - 10:15 PM IST (Night returns consolidation)
    - cron: '10 10 * * *'
    # Wave 4: 06:18 PM IST (12:48 UTC) -> Actually executes ~11:50 PM - 12:20 AM IST (Midnight wrap-up)
    - cron: '48 12 * * *'
    # Wave 5: 08:18 PM IST (14:48 UTC) -> Actually executes ~01:10 AM - 01:40 AM IST (Late night returns freeze)
    - cron: '48 14 * * *'
    # Wave 6: 11:18 PM IST (17:48 UTC) -> Actually executes ~02:30 AM - 03:26 AM IST (Final EOD Sync & Freeze)
    - cron: '48 17 * * *'

  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD) [Default: Today in IST]'
        required: false
        default: ''
      end_date:
        description: 'End Date (YYYY-MM-DD) [Default: Same as Start Date]'
        required: false
        default: ''
      states:
        description: 'Specific states (e.g. "madhya pradesh,rajasthan" or "all") [Default: 10 Core Priority States]'
        required: false
        default: ''

concurrency:
  group: mandi-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Mandi Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node src/index.js "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.states }}"
